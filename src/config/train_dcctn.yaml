datamodule:
  length_sec: 4
  batch_size: 32

model: "dcctn"        # new LightningModule wrapping Network.DCCTN
model_params:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  betas: [0.5, 0.999]
  stft_loss_config:
    fft_size: 128
    hop_size: 64
    win_length: 128
    scale_invariance: false
    w_sc: 0.0
    weight: 75.0

trainer:
  fast_dev:
    max_epochs: 1
    limit_train_batches: 5
    limit_val_batches: 5
    gradient_clip_val: 0.5
    devices: [0]
    accelerator: "gpu"
  full:
    max_epochs: 20
    gradient_clip_val: 10.0
    accumulate_grad_batches: 8
    # strategy: "ddp_find_unused_parameters_true"
    devices: [0]        # list for multi-GPU
    accelerator: "gpu"
  logging:
    use_wandb: true
    log_every_n_steps: 50
evaluate_test: false    # flip on to mimic DCCTN/test.py score dump
