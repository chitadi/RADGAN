
datamodule: 
  length_sec: 4
  batch_size: 16
  crop_fixed_on: []
  fixed_start_sec: 0.0
  num_workers: 2


model: "radgan"
model_params: 
  learning_rate: 0.0001


trainer:
  fast_dev:
    max_epochs: 1
    limit_train_batches: 5
    limit_val_batches: 5
    # gradient_clip_val: 0.5
    devices: [0]
    accelerator: "auto"
  full:
    max_epochs: 120
    # gradient_clip_val: 10.0
    # accumulate_grad_batches: 8
    devices: [0]        # list for multi-GPU
    accelerator: "auto"
  logging:
    use_wandb: true
    log_every_n_steps: 50
evaluate_test: false
